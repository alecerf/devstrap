version: 2

builds:
  - id: devstrap
    main: .
    binary: devstrap
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w -X github.com/alecerf/devstrap/internal/cli.Version={{ .Version }}

archives:
  - id: devstrap
    ids:
      - devstrap
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
